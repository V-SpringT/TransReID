MODEL:
  # === PRETRAINED MODEL SETTINGS ===
  PRETRAIN_CHOICE: 'imagenet'                    
  PRETRAIN_PATH: '/home/xxx/.cache/torch/checkpoints/jx_vit_base_p16_224-80ecf9dd.pth'  
  NAME: 'transformer'                           
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'  
  STRIDE_SIZE: [16, 16]                          
  
  # === LOSS FUNCTION SETTINGS ===
  METRIC_LOSS_TYPE: 'triplet'                    
  IF_LABELSMOOTH: 'off'                          
  IF_WITH_CENTER: 'no'                           
  NO_MARGIN: True                                
  
  # === CUHK03 SPECIFIC SETTINGS ===
  SIE_CAMERA: True                               
  SIE_COE: 3.0                                   
  JPM: True                                      
  RE_ARRANGE: True                               
  # === HARDWARE SETTINGS ===
  DEVICE_ID: ('0')                               

INPUT:
  # === IMAGE SIZE SETTINGS ===
  SIZE_TRAIN: [256, 128]                        
  SIZE_TEST: [256, 128]                         
  
  # === DATA AUGMENTATION SETTINGS ===
  PROB: 0.5                                      
  RE_PROB: 0.5                                   
  PADDING: 10                                    
  
  # === NORMALIZATION SETTINGS ===
  PIXEL_MEAN: [0.5, 0.5, 0.5]                  
  PIXEL_STD: [0.5, 0.5, 0.5]                    

DATASETS:
  # === DATASET CONFIGURATION ===
  NAMES: ('cuhk03')                              
  ROOT_DIR: ('../../data')                       

DATALOADER:
  # === SAMPLING STRATEGY ===
  SAMPLER: 'softmax_triplet'                     
  NUM_INSTANCE: 4                               
  
  # === PARALLEL PROCESSING ===
  NUM_WORKERS: 4                                 # Số worker song song để load dữ liệu (4 thread - tối ưu cho GTX 1080)

SOLVER:
  # === OPTIMIZER SETTINGS ===
  OPTIMIZER_NAME: 'SGD'                          
  BASE_LR: 0.008                                 
  IMS_PER_BATCH: 8                               # Số ảnh mỗi batch (8 ảnh - tối ưu cho GTX 1080)
  
  # === TRAINING SCHEDULE ===
  MAX_EPOCHS: 120                                
  WARMUP_METHOD: 'linear'                        
  LARGE_FC_LR: False                             
  
  # === REGULARIZATION ===
  WEIGHT_DECAY: 1e-4                             
  WEIGHT_DECAY_BIAS: 1e-4                       
  BIAS_LR_FACTOR: 2                              
  
  # === MEMORY OPTIMIZATION FOR GTX 1080 ===
  # Gỡ các khóa không có trong defaults để tránh KeyError khi merge
  # GRADIENT_ACCUMULATION_STEPS: 8
  # MIXED_PRECISION: True
  # GRADIENT_CLIP_NORM: 1.0
  
  # === LOGGING & CHECKPOINTING ===
  CHECKPOINT_PERIOD: 120                         
  LOG_PERIOD: 50                                 
  EVAL_PERIOD: 120                               

TEST:
  # === EVALUATION SETTINGS ===
  EVAL: True                                     
  IMS_PER_BATCH: 64                              # Batch size cho test (64 - tối ưu cho GTX 1080)
  RE_RANKING: False                             
  
  # === MODEL LOADING ===
  WEIGHT: '../logs/cuhk03_vit_transreid/transformer_120.pth'  
  
  # === FEATURE EXTRACTION ===
  NECK_FEAT: 'before'                            
  FEAT_NORM: 'yes'                               

# === OUTPUT DIRECTORY ===
OUTPUT_DIR: '../logs/cuhk03_vit_transreid'       
